[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-pointcloud"
version = "0.1.0"
description = "Chambolle-Pock total-variation denoising for point clouds."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
